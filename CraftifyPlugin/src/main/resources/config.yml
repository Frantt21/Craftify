# How to show the player's song on the server.

# --- Nametag mode (recommended) -------------------------------------------------
# Shows the title in the player's floating name (the nametag above the head).
# Advantage: it is part of the player's entity, so it follows them without lag.
# The owner of the name sees it in third person (F5) if the client mod includes the
# "see your own name" mixin (by default Minecraft does not show it).
nametag:
  # Enables/disables the nametag.
  enabled: true
  # Nametag format (Adventure MiniMessage). Placeholders:
  #   {name}  → player name
  #   {track} → "Song - Artist"
  # <newline> creates a second line.
  format: "<yellow>{name}</yellow><newline><green>♪ </green><white>{track}</white>"

# --- Hologram mode (optional) ---------------------------------------------------
# A TextDisplay entity that follows the player. It works, but being a separate entity
# that teleports every tick, a small delay can be noticed when moving.
hologram:
  # Enables/disables the hologram.
  enabled: false
  # Music icon glyph (Minecraft's default font). If it doesn't render well,
  # try "♫ " (U+266B) or another.
  icon: "♪ "
  # Height above the player, in blocks.
  height: 2.15
  # Text size (TextDisplay entity scale).
  scale: 0.6
