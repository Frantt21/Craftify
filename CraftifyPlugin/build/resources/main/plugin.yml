name: CraftifyPlugin
version: 1.0.0
main: org.foranly.craftifyplugin.CraftifyPlugin
api-version: '1.21'
description: Recibe el estado de Spotify de los jugadores (mod Craftify) y lo expone.
authors:
  - foranly
commands:
  nowplaying:
    description: Muestra el estado actual de Spotify del jugador.
    usage: /nowplaying
    permission: craftifyplugin.nowplaying
permissions:
  craftifyplugin.nowplaying:
    description: Permite ver el estado de Spotify propio.
    default: true
