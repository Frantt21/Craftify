# Cómo mostrar la canción del jugador en el servidor.

# --- Modo nametag (recomendado) ------------------------------------------------
# Muestra el título en el nombre flotante del jugador (el nametag sobre la cabeza).
# Ventaja: es parte de la entidad del jugador, así que lo sigue sin lag.
# El jugador dueño del nombre lo ve en tercera persona (F5) si el mod del cliente
# incluye el mixin de "ver tu propio nombre" (por defecto Minecraft no lo muestra).
nametag:
  # Activa/desactiva el nametag.
  enabled: true
  # Formato del nametag (MiniMessage de Adventure). Placeholders:
  #   {name}  → nombre del jugador
  #   {track} → "Canción - Artista"
  # <newline> crea una segunda línea.
  format: "<yellow>{name}</yellow><newline><green>♪ </green><white>{track}</white>"

# --- Modo holograma (opcional) -------------------------------------------------
# Entidad TextDisplay que sigue al jugador. Funciona, pero al ser una entidad aparte
# que se teletransporta por tick puede notarse un pequeño retraso al moverse.
hologram:
  # Activa/desactiva el holograma.
  enabled: false
  # Glifo del icono de música (fuente por defecto de Minecraft). Si no se ve bien,
  # probar "♫ " (U+266B) u otro.
  icon: "♪ "
  # Altura sobre el jugador, en bloques.
  height: 2.15
  # Tamaño del texto (escala de la entidad TextDisplay).
  scale: 0.6
